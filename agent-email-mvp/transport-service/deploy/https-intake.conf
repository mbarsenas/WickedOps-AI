limit_req_zone $binary_remote_addr zone=senderpermit_intake:10m rate=10r/s;
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name mail.senderpermit.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/senderpermit-acme; }
    location / { return 308 https://mail.senderpermit.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name mail.senderpermit.com;
    ssl_certificate /etc/letsencrypt/live/mail.senderpermit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.senderpermit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 250k;
    client_body_timeout 15s;
    server_tokens off;
    location ~ ^/v1/submissions(?:/sp_[a-f0-9-]+)?$ {
        limit_req zone=senderpermit_intake burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4380;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_set_header Host mail.senderpermit.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }
}
